<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px; width: 100%; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 16px; }
        #result { margin-top: 20px; padding: 12px; background: #f0f0f0; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Calorie Tracker</h1>

    <label>Gender</label>
    <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>

    <label>Age (years)</label>
    <input type="number" id="age" value="25">

    <label>Height (cm)</label>
    <input type="number" id="height" value="170">

    <label>Weight (kg)</label>
    <input type="number" id="weight" value="65">

    <label>Activity Level</label>
    <select id="activity">
        <option value="1.2">Sedentary (little exercise)</option>
        <option value="1.375">Light exercise (1-3 days/week)</option>
        <option value="1.55">Moderate exercise (3-5 days/week)</option>
        <option value="1.725">Heavy exercise (6-7 days/week)</option>
    </select>

    <label>Weekly Weight Loss Goal</label>
    <select id="deficit">
        <option value="275">Lose 0.25 kg per week (mild)</option>
        <option value="550">Lose 0.5 kg per week (standard)</option>
    </select>

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <script>
        function calculate() {
    // 1. Read values from the form
    const gender = document.getElementById('gender').value;
    const age = parseFloat(document.getElementById('age').value);
    const height = parseFloat(document.getElementById('height').value);
    const weight = parseFloat(document.getElementById('weight').value);
    const activity = parseFloat(document.getElementById('activity').value);
    const deficit = parseFloat(document.getElementById('deficit').value);

    // 2. Calculate BMR using Mifflin-St Jeor
    let bmr;
    if (gender === 'male') {
        bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
    } else {
        bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
    }

    // 3. Calculate TDEE
    const tdee = bmr * activity;

    // 4. Calculate daily calorie target
    const target = tdee - deficit;

    // 5. Show result
    document.getElementById('result').innerHTML = `
        <p><strong>Your BMR:</strong> ${bmr.toFixed(0)} kcal/day</p>
        <p><strong>Your TDEE:</strong> ${tdee.toFixed(0)} kcal/day</p>
        <p><strong>Daily Calorie Target:</strong> ${target.toFixed(0)} kcal/day</p>
    `;
}
    </script>
</body>
</html>
